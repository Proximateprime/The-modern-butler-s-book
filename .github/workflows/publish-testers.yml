# Rebuild hosted tester artifacts as packaged copy only.
# Never pass a phrasing-provider key into the build.
# Do not configure the butler function here — testers stay packaged if it is unset.
# Play Store listing / store upload is out.
name: Publish tester web and APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-testers.yml"
      - "tool/assert_packaged_tester_build.sh"
      - "tool/sync_pages_web.sh"
      - "pubspec.yaml"
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# PRs validate in parallel. All main publishes (push + dispatch) share one group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('publish-testers-pr-{0}', github.event.pull_request.number) || 'publish-testers' }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Packaged-copy gate (no live phrasing key)
        run: bash tool/assert_packaged_tester_build.sh

      - name: Java (APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Flutter web (no dart-define)
        run: |
          set -euo pipefail
          bash tool/assert_packaged_tester_build.sh
          flutter build web --release --base-href "/The-modern-butler-s-book/"
          touch build/web/.nojekyll
          bash tool/assert_packaged_tester_build.sh --scan-web

      - name: Deploy gh-pages (Flutter web, Jekyll off)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prefer gh-pages as Pages source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF' || true
          {"source":{"branch":"gh-pages","path":"/"}}
          EOF

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Pages (when source is GitHub Actions)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Sync Flutter web onto main for legacy Pages (main /)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/sync_pages_web.sh --commit

      - name: Build sideload APK (debug signing, no dart-define)
        run: |
          set -euo pipefail
          bash tool/assert_packaged_tester_build.sh
          flutter build apk --release

      - name: Scan APK then attach to version-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          TAG="v${VERSION}"
          ASSET="modern-butlers-book-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          bash tool/assert_packaged_tester_build.sh --scan-apk "$ASSET"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "PR build: APK scanned, not attached to the release."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes "Tester sideload APK ${VERSION}. Debug-signed. Not Play Store. Packaged copy only."
          fi
          gh release upload "$TAG" "$ASSET" --clobber
