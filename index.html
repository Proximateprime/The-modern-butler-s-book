<!DOCTYPE html>
<html>
<head>
  <base href="/The-modern-butler-s-book/site/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="The Modern Butler's Book developer demo."
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="manifest.json">
  <title>The Modern Butler's Book</title>
</head>
<body>
  <script>
    // First click after load must reach Flutter widgets (Skip, chips).
    window.addEventListener('flutter-first-frame', function () {
      var view = document.querySelector('flutter-view');
      if (view && typeof view.focus === 'function') {
        view.focus();
      }
      var canvas = document.querySelector('canvas');
      if (canvas && typeof canvas.focus === 'function') {
        canvas.focus();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
