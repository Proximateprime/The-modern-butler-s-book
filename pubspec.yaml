name: modern_butlers_book
description: The Modern Butler's Book — AI-assisted home appliance troubleshooting.
publish_to: none
version: 0.1.4+0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_barcode_scanning: ^0.15.0
  camera: ^0.11.2
  speech_to_text: ^7.3.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F3EDE3"
  adaptive_icon_foreground: assets/brand/app_icon.png
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
